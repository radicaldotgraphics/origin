<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="QR Code Generator — Radical Graphics" />
    <meta name="description" content="Generate a styled QR code. Pick your dots, markers and colors, check the contrast, and download as PNG, JPG or SVG." />
    <meta property="og:title" content="QR Code Generator — Radical Graphics" />
    <meta property="og:description" content="Generate a styled QR code. Pick your dots, markers and colors, check the contrast, and download as PNG, JPG or SVG." />
    <meta property="og:image" content="https://radical.graphics/assets/radical_logo.png" />
    <title>QR Code Generator — Radical Graphics</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://use.typekit.net/tok0jjl.css">
    <link rel="stylesheet" href="qr.css">
</head>

<body>
    <main id="qrApp">
        <div id="qrHead">
            <a id="qrMark" href="/" aria-label="Radical Graphics">
                <!-- Lottie mounts here; the inline mark stays as the fallback
                     if the animation or its data fails to load. -->
                <span id="qrMarkAnim" aria-hidden="true"></span>
                <svg id="qrLogo" viewBox="0 0 312 88" aria-hidden="true">
                    <path d="M283.4,61.7c-8.4-4.6-11.9-12.8-12-19.6V0.5h-22.8v16.7l43.3,69.7C293,87,312,87,312,87V64.5C312,64.5,291.4,66,283.4,61.7z M238.7,7L289,87h-25.8l-24.5-39.6L214.2,87h-25.8L238.7,7z M172.5,75.1c-8.6-11.8-10.1-24.9-8.5-35.2c2-12.7,9.1-23.7,19-30.8c10.4-7.5,23.4-10.3,35.4-8.4c6.2,1,12.1,3.1,17.4,6.4l-11.1,18c-15.1-9.2-30.4-0.7-36.1,8.6c-9.3,15.1-0.7,30.1,8.5,35.8l-11.2,18C180.6,84.2,176.1,80,172.5,75.1z M169.1,12.7c0,7-5.7,12.7-12.7,12.7s-12.7-5.7-12.7-12.7c0-7,5.7-12.7,12.7-12.7S169.1,5.7,169.1,12.7z M163.6,26.5c-5.4,2.9-11.1,2-14.8,0c10.5,22.8,0.4,41.9-3,47.4v13.2h20.9V74C162.8,67.8,153.3,48.9,163.6,26.5z M149.5,39.9C145.4,14.4,124.9,4,113.6,1.3C99.4-2.1,86.5,1.6,77.6,7l11.1,18c19.5-11.8,44.8,5.3,39.3,28.3c-1.6,6.7-5.8,12.4-11.7,16.1l11.2,18C138,81,153.5,64.7,149.5,39.9z M73.8,6.9L23.6,87h25.8l24.5-39.7L98.3,87h25.8L73.8,6.9z M46.9,0.2C28.5-0.2,14,9.9,6.5,22.3C2.4,29,0.2,36.9,0,45.1V87h20.7l2.1-3.4V45.5c0.3-15.8,17.9-29.3,35.5-18.6L70.1,7C63.1,2.7,55.2,0.4,46.9,0.2z"/>
                </svg>
            </a>
            <h1 id="qrTitle">Radical: QR Code Generator</h1>
            <div id="qrLinkBar">
                <label class="groupLabel" for="qrUrl">URL</label>
                <input id="qrUrl" type="text" spellcheck="false" autocomplete="off"
                       placeholder="radical.graphics" value="https://radical.graphics">
                <div class="note" id="qrUrlNote"></div>
            </div>
        </div>

        <div id="qrBody">
            <section id="qrPreviewPane">
                <div id="qrPreviewInner">
                    <div id="qrStageWrap">
                        <div id="qrStage" aria-live="polite"></div>
                    </div>

                    <div id="qrDownloads" aria-label="Download">
                        <button class="dlBtn" data-fmt="png">PNG</button>
                        <button class="dlBtn" data-fmt="jpg">JPG</button>
                        <button class="dlBtn" data-fmt="svg">SVG</button>
                    </div>

                    <div id="qrHint">Scan your QR code to test it out</div>
                </div>
            </section>

            <section id="qrControls">

            <!-- ── Style ──────────────────────────────────────────── -->
            <div class="group">
                <span class="groupLabel">Dots</span>
                <!-- Each icon is a true 2x1 sample of what the renderer draws for
                     two adjacent modules in that style. -->
                <div class="optRow" id="optDots" role="radiogroup" aria-label="Dot style">
                    <button class="opt" data-val="rounded" role="radio" aria-label="Rounded dots">
                        <svg viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="9" rx="4.5" fill="currentColor"/></svg>
                    </button>
                    <button class="opt" data-val="square" role="radio" aria-label="Square dots">
                        <svg viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="9" fill="currentColor"/></svg>
                    </button>
                    <button class="opt" data-val="dots" role="radio" aria-label="Circular dots">
                        <svg viewBox="0 0 24 24"><g fill="currentColor">
                            <circle cx="7.5" cy="12" r="3.8"/><circle cx="16.5" cy="12" r="3.8"/>
                        </g></svg>
                    </button>
                    <button class="opt" data-val="hearts" role="radio" aria-label="Heart dots">
                        <svg viewBox="0 0 24 24"><g fill="currentColor">
                            <path d="M7.5 16.5S3.3 13.4 3.3 10.7c0-1.7 1.4-2.5 2.5-2.5.9 0 1.7.8 1.7.8s.8-.8 1.7-.8c1.1 0 2.5.8 2.5 2.5 0 2.7-4.2 5.8-4.2 5.8z"/>
                            <path d="M16.5 16.5s-4.2-3.1-4.2-5.8c0-1.7 1.4-2.5 2.5-2.5.9 0 1.7.8 1.7.8s.8-.8 1.7-.8c1.1 0 2.5.8 2.5 2.5 0 2.7-4.2 5.8-4.2 5.8z"/>
                        </g></svg>
                    </button>
                    <button class="opt" data-val="stars" role="radio" aria-label="Star dots">
                        <svg viewBox="0 0 24 24"><g fill="currentColor">
                            <path d="M7.5 7.2l1.3 2.9 3.1.3-2.3 2.1.7 3.1-2.8-1.6-2.8 1.6.7-3.1-2.3-2.1 3.1-.3z"/>
                            <path d="M16.5 7.2l1.3 2.9 3.1.3-2.3 2.1.7 3.1-2.8-1.6-2.8 1.6.7-3.1-2.3-2.1 3.1-.3z"/>
                        </g></svg>
                    </button>
                </div>

                <span class="groupLabel">Marker border</span>
                <div class="optRow" id="optMarkerBorder" role="radiogroup" aria-label="Marker border style">
                    <button class="opt" data-val="square" role="radio" aria-label="Square marker border">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd"
                            d="M3 3h18v18H3V3zm3 3v12h12V6H6z"/></svg>
                    </button>
                    <button class="opt" data-val="rounded" role="radio" aria-label="Rounded marker border">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd"
                            d="M8 3h8a5 5 0 015 5v8a5 5 0 01-5 5H8a5 5 0 01-5-5V8a5 5 0 015-5zm0 3a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2V8a2 2 0 00-2-2H8z"/></svg>
                    </button>
                    <button class="opt" data-val="circle" role="radio" aria-label="Circular marker border">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd"
                            d="M12 3a9 9 0 110 18 9 9 0 010-18zm0 3a6 6 0 100 12 6 6 0 000-12z"/></svg>
                    </button>
                </div>

                <span class="groupLabel">Marker center</span>
                <div class="optRow" id="optMarkerCenter" role="radiogroup" aria-label="Marker center style">
                    <button class="opt" data-val="square" role="radio" aria-label="Square marker center">
                        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" fill="currentColor"/></svg>
                    </button>
                    <button class="opt" data-val="dot" role="radio" aria-label="Round marker center">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>
                    </button>
                </div>

                <span class="groupLabel">Accuracy</span>
                <div class="optRow" id="optEcc" role="radiogroup" aria-label="Accuracy">
                    <button class="opt pill" data-val="L" role="radio">Low</button>
                    <button class="opt pill" data-val="H" role="radio">High</button>
                </div>
                <div class="note" id="qrEccNote">Higher = more easily detectable, but uses a more complex shape.</div>
            </div>

            <!-- ── Color ──────────────────────────────────────────── -->
            <div class="group">
                <span class="groupLabel">Color</span>
                <div class="colorRow">
                    <label class="swatch">
                        <input type="color" id="qrFg" value="#000000">
                        <span class="swatchChip" id="qrFgChip"></span>
                    </label>
                    <input type="text" class="hex" id="qrFgHex" value="#000000" spellcheck="false" aria-label="Foreground hex">
                    <span class="swatchName">Dots</span>
                </div>
                <div class="colorRow" id="qrBgRow">
                    <label class="swatch">
                        <input type="color" id="qrBg" value="#FFFFFF">
                        <span class="swatchChip" id="qrBgChip"></span>
                    </label>
                    <input type="text" class="hex" id="qrBgHex" value="#FFFFFF" spellcheck="false" aria-label="Background hex">
                    <span class="swatchName">Background</span>
                </div>
                <label class="check">
                    <input type="checkbox" id="qrTransparent">
                    <span>Transparent background</span>
                </label>
                <div id="qrContrast" class="contrast">
                    <span class="contrastDot"></span>
                    <span class="contrastText"></span>
                </div>
                <div class="note" id="qrContrastNote"></div>
            </div>

            <!-- ── Centre space ───────────────────────────────────── -->
            <div class="group">
                <span class="groupLabel">Center</span>
                <label class="check">
                    <input type="checkbox" id="qrReserve">
                    <span>Make space for center logo</span>
                </label>
                    <div class="note" id="qrReserveNote"></div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="qr.js"></script>
</body>
</html>
