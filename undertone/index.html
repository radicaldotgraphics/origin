<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Undertone — Radical Graphics" />
    <meta name="description" content="Every image has a song underneath it. Drop in a picture: vertical lines become the beat, dots become the notes." />
    <meta property="og:title" content="Undertone — Radical Graphics" />
    <meta property="og:description" content="Every image has a song underneath it. Drop in a picture: vertical lines become the beat, dots become the notes." />
    <meta property="og:image" content="https://radical.graphics/assets/radical_logo.png" />
    <title>Undertone — Radical Graphics</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://use.typekit.net/tok0jjl.css">
    <link rel="stylesheet" href="undertone.css">
</head>

<body>
    <main id="utApp">
        <header id="utHead">
            <a id="utMark" href="/" aria-label="Radical Graphics">
                <!-- Lottie mounts here; the inline mark stays as the fallback
                     if the animation or its data fails to load. -->
                <span id="utMarkAnim" aria-hidden="true"></span>
                <svg id="utLogo" viewBox="0 0 312 88" aria-hidden="true">
                    <path d="M283.4,61.7c-8.4-4.6-11.9-12.8-12-19.6V0.5h-22.8v16.7l43.3,69.7C293,87,312,87,312,87V64.5C312,64.5,291.4,66,283.4,61.7z M238.7,7L289,87h-25.8l-24.5-39.6L214.2,87h-25.8L238.7,7z M172.5,75.1c-8.6-11.8-10.1-24.9-8.5-35.2c2-12.7,9.1-23.7,19-30.8c10.4-7.5,23.4-10.3,35.4-8.4c6.2,1,12.1,3.1,17.4,6.4l-11.1,18c-15.1-9.2-30.4-0.7-36.1,8.6c-9.3,15.1-0.7,30.1,8.5,35.8l-11.2,18C180.6,84.2,176.1,80,172.5,75.1z M169.1,12.7c0,7-5.7,12.7-12.7,12.7s-12.7-5.7-12.7-12.7c0-7,5.7-12.7,12.7-12.7S169.1,5.7,169.1,12.7z M163.6,26.5c-5.4,2.9-11.1,2-14.8,0c10.5,22.8,0.4,41.9-3,47.4v13.2h20.9V74C162.8,67.8,153.3,48.9,163.6,26.5z M149.5,39.9C145.4,14.4,124.9,4,113.6,1.3C99.4-2.1,86.5,1.6,77.6,7l11.1,18c19.5-11.8,44.8,5.3,39.3,28.3c-1.6,6.7-5.8,12.4-11.7,16.1l11.2,18C138,81,153.5,64.7,149.5,39.9z M73.8,6.9L23.6,87h25.8l24.5-39.7L98.3,87h25.8L73.8,6.9z M46.9,0.2C28.5-0.2,14,9.9,6.5,22.3C2.4,29,0.2,36.9,0,45.1V87h20.7l2.1-3.4V45.5c0.3-15.8,17.9-29.3,35.5-18.6L70.1,7C63.1,2.7,55.2,0.4,46.9,0.2z"/>
                </svg>
            </a>
            <div id="utTitleBlock">
                <h1 id="utTitle">Radical: Undertone</h1>
                <p id="utTagline">Visual noise</p>
            </div>
            <button id="utNew" class="ghostBtn" hidden>New image</button>
        </header>

        <div id="utBody">
            <section id="utStagePane">
                <div id="utStage">
                    <div id="utCanvasWrap" hidden>
                        <canvas id="utCanvas"></canvas>
                    </div>
                    <div id="utDrop">
                        <div class="dropInner" id="utDropInner">
                            <svg viewBox="0 0 48 48" aria-hidden="true" class="dropIcon">
                                <line x1="10" y1="8" x2="10" y2="40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <line x1="26" y1="8" x2="26" y2="40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <line x1="41" y1="8" x2="41" y2="40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="18" cy="16" r="3.5" fill="currentColor"/>
                                <circle cx="34" cy="28" r="5" fill="currentColor"/>
                                <circle cx="17" cy="33" r="2.5" fill="currentColor"/>
                            </svg>
                            <p class="dropTitle">Drop in an image</p>
                            <p class="dropSub">Press <kbd>⌘</kbd><kbd>V</kbd>, drop a file anywhere,
                                <button type="button" id="utBrowse" class="linkBtn">choose a file</button>
                                or <button type="button" id="utSample" class="linkBtn">try a sample</button></p>
                        </div>
                        <div class="dropInner" id="utPicker" hidden>
                            <p class="dropTitle">Choose a sample</p>
                            <div id="utPickerGrid"></div>
                            <p class="dropSub"><button type="button" id="utPickerBack" class="linkBtn">back</button></p>
                        </div>
                    </div>
                </div>
            </section>

            <aside id="utPanel">
                <button id="utPlay" disabled>
                    <svg id="utPlayIcon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z"/></svg>
                    <svg id="utStopIcon" viewBox="0 0 16 16" aria-hidden="true" hidden><rect x="3" y="3" width="10" height="10"/></svg>
                    <span id="utPlayLabel">Play</span>
                </button>

                <p id="utStats">&nbsp;</p>

                <div class="ctl">
                    <label for="utTempo">Tempo <span class="val" id="utTempoVal">96 bpm</span></label>
                    <input type="range" id="utTempo" min="60" max="160" step="1" value="96">
                </div>

                <div class="ctl">
                    <label id="utScaleLabel">Scale</label>
                    <div class="iconRow" id="utScale" role="radiogroup" aria-labelledby="utScaleLabel">
                        <button class="opt" type="button" role="radio" data-val="majorPent"
                                title="Major pentatonic — bright and open" aria-label="Major pentatonic">
                            <img src="major.svg" alt="">
                        </button>
                        <button class="opt" type="button" role="radio" data-val="minorPent"
                                title="Minor pentatonic — darker, bluesy" aria-label="Minor pentatonic">
                            <img src="minor.svg" alt="">
                        </button>
                        <button class="opt" type="button" role="radio" data-val="insen"
                                title="In-sen — sparse and Japanese-sounding" aria-label="In-sen">
                            <img src="in-sen.svg" alt="">
                        </button>
                    </div>
                </div>

                <div class="ctl">
                    <label id="utLineSensLabel">Beat sensitivity</label>
                    <div class="iconRow wave" id="utLineSens" role="radiogroup" aria-labelledby="utLineSensLabel">
                        <button class="opt" type="button" role="radio" data-val="0"
                                title="Sparse" aria-label="Sparse beats">
                            <img src="waveform-simple.svg" alt="">
                        </button>
                        <button class="opt" type="button" role="radio" data-val="50"
                                title="Balanced" aria-label="Balanced beats">
                            <img src="waveform-med.svg" alt="">
                        </button>
                        <button class="opt" type="button" role="radio" data-val="100"
                                title="Busy" aria-label="Busy beats">
                            <img src="waveform-complex.svg" alt="">
                        </button>
                    </div>
                </div>

                <div class="ctl">
                    <label id="utDotSensLabel">Note sensitivity</label>
                    <div class="iconRow wave" id="utDotSens" role="radiogroup" aria-labelledby="utDotSensLabel">
                        <button class="opt" type="button" role="radio" data-val="0"
                                title="Sparse" aria-label="Sparse notes">
                            <img src="waveform-simple.svg" alt="">
                        </button>
                        <button class="opt" type="button" role="radio" data-val="50"
                                title="Balanced" aria-label="Balanced notes">
                            <img src="waveform-med.svg" alt="">
                        </button>
                        <button class="opt" type="button" role="radio" data-val="100"
                                title="Busy" aria-label="Busy notes">
                            <img src="waveform-complex.svg" alt="">
                        </button>
                    </div>
                </div>

                <div class="ctl" id="utLibraryCtl">
                    <label>Images</label>
                    <div id="utLibrary"></div>
                </div>
            </aside>
        </div>
    </main>

    <input type="file" id="utFile" accept="image/*" hidden>
    <script src="undertone.js"></script>
</body>
</html>
