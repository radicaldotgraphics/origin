<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Binary Clock — Radical Graphics" />
    <meta name="description" content="A binary clock of glowing dots. Switch 12/24 hour, shuffle the palette, go fullscreen." />
    <meta property="og:title" content="Binary Clock — Radical Graphics" />
    <meta property="og:description" content="A binary clock of glowing dots. Switch 12/24 hour, shuffle the palette, go fullscreen." />
    <meta property="og:image" content="https://radical.graphics/assets/radical_logo.png" />
    <title>Binary Clock — Radical Graphics</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://use.typekit.net/tok0jjl.css">
    <link rel="stylesheet" href="clock.css">
</head>

<body>
    <main id="bcApp">
        <div id="bcHead">
            <a id="bcMark" href="/" aria-label="Radical Graphics">
                <!-- Lottie mounts here; the inline mark stays as the fallback
                     if the animation or its data fails to load. -->
                <span id="bcMarkAnim" aria-hidden="true"></span>
                <svg id="bcLogo" viewBox="0 0 312 88" aria-hidden="true">
                    <path d="M283.4,61.7c-8.4-4.6-11.9-12.8-12-19.6V0.5h-22.8v16.7l43.3,69.7C293,87,312,87,312,87V64.5C312,64.5,291.4,66,283.4,61.7z M238.7,7L289,87h-25.8l-24.5-39.6L214.2,87h-25.8L238.7,7z M172.5,75.1c-8.6-11.8-10.1-24.9-8.5-35.2c2-12.7,9.1-23.7,19-30.8c10.4-7.5,23.4-10.3,35.4-8.4c6.2,1,12.1,3.1,17.4,6.4l-11.1,18c-15.1-9.2-30.4-0.7-36.1,8.6c-9.3,15.1-0.7,30.1,8.5,35.8l-11.2,18C180.6,84.2,176.1,80,172.5,75.1z M169.1,12.7c0,7-5.7,12.7-12.7,12.7s-12.7-5.7-12.7-12.7c0-7,5.7-12.7,12.7-12.7S169.1,5.7,169.1,12.7z M163.6,26.5c-5.4,2.9-11.1,2-14.8,0c10.5,22.8,0.4,41.9-3,47.4v13.2h20.9V74C162.8,67.8,153.3,48.9,163.6,26.5z M149.5,39.9C145.4,14.4,124.9,4,113.6,1.3C99.4-2.1,86.5,1.6,77.6,7l11.1,18c19.5-11.8,44.8,5.3,39.3,28.3c-1.6,6.7-5.8,12.4-11.7,16.1l11.2,18C138,81,153.5,64.7,149.5,39.9z M73.8,6.9L23.6,87h25.8l24.5-39.7L98.3,87h25.8L73.8,6.9z M46.9,0.2C28.5-0.2,14,9.9,6.5,22.3C2.4,29,0.2,36.9,0,45.1V87h20.7l2.1-3.4V45.5c0.3-15.8,17.9-29.3,35.5-18.6L70.1,7C63.1,2.7,55.2,0.4,46.9,0.2z"/>
                </svg>
            </a>
            <h1 id="bcTitle">Radical: Binary Clock</h1>
        </div>

        <div id="bcBody">
            <section id="bcStagePane">
                <div id="bcStage" role="img" aria-live="off">
                    <div id="bcClock"></div>
                    <div id="bcReadout" aria-hidden="true"></div>
                    <button id="bcExit" type="button" aria-label="Exit fullscreen" title="Exit fullscreen (F)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <div id="bcActions">
                    <button class="dlBtn" id="bcShuffle" type="button" title="Shuffle colors (Space)">Shuffle colors</button>
                    <button class="dlBtn" id="bcFull" type="button" title="Fullscreen (F)">Fullscreen</button>
                </div>
                <div id="bcHint">Space shuffles colors &middot; F toggles fullscreen</div>
            </section>

            <section id="bcControls">
                <!-- ── Time ─────────────────────────────────────────── -->
                <div class="group">
                    <span class="groupLabel">Hours</span>
                    <div class="optRow" id="optHours" role="radiogroup" aria-label="Hour format">
                        <button class="opt pill" data-val="12" role="radio">12 hr</button>
                        <button class="opt pill" data-val="24" role="radio">24 hr</button>
                    </div>

                    <span class="groupLabel">Layout</span>
                    <div class="optRow" id="optLayout" role="radiogroup" aria-label="Layout">
                        <button class="opt" data-val="bcd" role="radio" aria-label="Columns: one per digit" title="Columns — one per digit">
                            <svg viewBox="0 0 24 24"><g fill="currentColor">
                                <circle cx="5" cy="18" r="2"/><circle cx="5" cy="12" r="2"/>
                                <circle cx="12" cy="18" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="6" r="2"/>
                                <circle cx="19" cy="18" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="19" cy="6" r="2"/>
                            </g></svg>
                        </button>
                        <button class="opt" data-val="rows" role="radio" aria-label="Rows: one per unit" title="Rows — hours, minutes, seconds">
                            <svg viewBox="0 0 24 24"><g fill="currentColor">
                                <circle cx="4" cy="6" r="1.8"/><circle cx="9.3" cy="6" r="1.8"/><circle cx="14.7" cy="6" r="1.8"/><circle cx="20" cy="6" r="1.8"/>
                                <circle cx="4" cy="12" r="1.8"/><circle cx="9.3" cy="12" r="1.8"/><circle cx="14.7" cy="12" r="1.8"/><circle cx="20" cy="12" r="1.8"/>
                                <circle cx="4" cy="18" r="1.8"/><circle cx="9.3" cy="18" r="1.8"/><circle cx="14.7" cy="18" r="1.8"/><circle cx="20" cy="18" r="1.8"/>
                            </g></svg>
                        </button>
                    </div>
                    <div class="note" id="bcLayoutNote"></div>

                    <label class="check">
                        <input type="checkbox" id="bcSeconds">
                        <span>Show seconds</span>
                    </label>
                    <label class="check">
                        <input type="checkbox" id="bcDigits">
                        <span>Show digits</span>
                    </label>
                </div>

                <!-- ── Color ────────────────────────────────────────── -->
                <div class="group">
                    <span class="groupLabel">Glow colors</span>
                    <div id="bcPalette" role="group" aria-label="Glow colors"></div>
                    <div class="note" id="bcPaletteName"></div>

                    <span class="groupLabel">Color mix</span>
                    <div class="optRow" id="optMix" role="radiogroup" aria-label="Color mix">
                        <button class="opt pill" data-val="uniform" role="radio" title="Every orb glows the same">Uniform</button>
                        <button class="opt pill" data-val="varied" role="radio" title="Each orb starts the palette somewhere else">Varied</button>
                        <button class="opt pill" data-val="group" role="radio" title="Each column or row shares a mix">Group</button>
                    </div>

                    <span class="groupLabel">Auto shuffle</span>
                    <div class="optRow" id="optAuto" role="radiogroup" aria-label="Auto shuffle">
                        <button class="opt pill" data-val="off" role="radio">Off</button>
                        <button class="opt pill" data-val="minute" role="radio">Minute</button>
                        <button class="opt pill" data-val="hour" role="radio">Hour</button>
                    </div>
                </div>

                <!-- ── Glow ─────────────────────────────────────────── -->
                <div class="group">
                    <span class="groupLabel">Background</span>
                    <div class="optRow" id="optTheme" role="radiogroup" aria-label="Background">
                        <button class="opt pill" data-val="dark" role="radio">Dark</button>
                        <button class="opt pill" data-val="light" role="radio">Light</button>
                    </div>

                    <span class="groupLabel">Speed</span>
                    <div class="optRow" id="optSpeed" role="radiogroup" aria-label="Speed">
                        <button class="opt pill" data-val="still" role="radio">Still</button>
                        <button class="opt pill" data-val="slow" role="radio">Slow</button>
                        <button class="opt pill" data-val="med" role="radio">Med</button>
                        <button class="opt pill" data-val="fast" role="radio">Fast</button>
                    </div>

                    <span class="groupLabel">Glow size</span>
                    <div class="optRow" id="optScale" role="radiogroup" aria-label="Glow size">
                        <button class="opt pill" data-val="small" role="radio">Small</button>
                        <button class="opt pill" data-val="med" role="radio">Med</button>
                        <button class="opt pill" data-val="lg" role="radio">Large</button>
                    </div>

                    <label class="check">
                        <input type="checkbox" id="bcGhost">
                        <span>Show unlit dots</span>
                    </label>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="clock.js"></script>
</body>
</html>
