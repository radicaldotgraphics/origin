<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
    <!-- Source for the toolbar icons. Regenerate the PNGs with icons/build.sh.
         The icon is the product: a screenshot sitting on a gradient with a
         shadow under it. Kept to two shapes so it still reads at 16px. -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8E7CFF"/>
            <stop offset="1" stop-color="#FF9AA2"/>
        </linearGradient>
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dy="4" result="blur"/>
            <feFlood flood-color="#000" flood-opacity="0.42"/>
            <feComposite in2="blur" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="128" height="128" rx="28" fill="url(#bg)"/>

    <g filter="url(#shadow)">
        <rect x="24" y="33" width="80" height="62" rx="9" fill="#fff"/>
        <rect x="24" y="33" width="80" height="14" rx="9" fill="#e9e9ee"/>
        <rect x="24" y="38" width="80" height="9" fill="#e9e9ee"/>
        <circle cx="33" cy="40" r="2.6" fill="#ff5f57"/>
        <circle cx="41.5" cy="40" r="2.6" fill="#febc2e"/>
        <circle cx="50" cy="40" r="2.6" fill="#28c840"/>
    </g>
</svg>
